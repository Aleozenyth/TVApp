name: iOS CI & Demo Video

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-record:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Boot Simulator & Record Demo
        run: |
          # Boot iPhone Simulator
          UDID=$(xcrun simctl create "DemoPhone" "iPhone 15" "iOS17.5" || true)
          xcrun simctl boot $UDID || true
          
          # Record video in background
          xcrun simctl io $UDID recordVideo demo.mp4 &
          RECORD_PID=$!
          
          # Run tests
          xcodebuild test -project TVApp.xcodeproj -scheme TVApp -destination "id=$UDID" || true
          
          # Stop recording
          sleep 5
          kill -2 $RECORD_PID || true

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-demo
          path: demo.mp4
