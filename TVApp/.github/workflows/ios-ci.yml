name: iOS CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # macOS runners come with Xcode + Homebrew preinstalled — this is what lets
    # you validate the project from a Windows machine, purely via git push.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        # Useful the first time this runs: if the destination below fails because
        # the simulator name/OS doesn't exist on this runner image, check this
        # step's log and adjust the -destination value in the next step.
        run: xcrun simctl list devices available

      - name: Build and test
        run: |
          xcodebuild test \
            -project TVApp.xcodeproj \
            -scheme TVApp \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -resultBundlePath TestResults
